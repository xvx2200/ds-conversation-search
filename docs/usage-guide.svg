  <text x="906" y="296" font-size="11" fill="#6b7280" text-anchor="middle">当前工作区</text>
  <line x1="680" y1="316" x2="1240" y2="316" stroke="#eef0f3"/>

  <!-- results -->
  <text x="704" y="344" font-size="12" font-weight="600" fill="#1f2328">修复登录超时</text>
  <text x="1196" y="344" font-size="10" fill="#8a919b" text-anchor="end">10:24</text>
  <rect x="704" y="358" width="28" height="18" rx="9" fill="#f1f3f5"/>
  <text x="718" y="371" font-size="10" fill="#6b7280" text-anchor="middle">你</text>
  <text x="740" y="372" font-size="12" fill="#1f2328">登录一直超时，帮我看看</text>
  <rect x="884" y="360" width="70" height="18" rx="3" fill="#fff3c4"/>
  <text x="889" y="373" font-size="12" font-weight="600" fill="#8a5a00">错误码 401</text>

  <text x="704" y="434" font-size="12" font-weight="600" fill="#1f2328">部署脚本排查</text>
  <text x="1196" y="434" font-size="10" fill="#8a919b" text-anchor="end">昨天</text>
  <rect x="704" y="448" width="52" height="18" rx="9" fill="#f1f3f5"/>
  <text x="730" y="461" font-size="10" fill="#6b7280" text-anchor="middle">工具结果</text>
  <text x="766" y="462" font-size="12" fill="#1f2328">请求返回</text>
  <rect x="818" y="450" width="70" height="18" rx="3" fill="#fff3c4"/>
  <text x="823" y="463" font-size="12" font-weight="600" fill="#8a5a00">错误码 500</text>
  <text x="898" y="462" font-size="12" fill="#1f2328">，重试 2 次</text>

  <text x="704" y="524" font-size="12" font-weight="600" fill="#1f2328">鉴权排查</text>
  <text x="1196" y="524" font-size="10" fill="#8a919b" text-anchor="end">10:19</text>
  <rect x="704" y="538" width="36" height="18" rx="9" fill="#f1f3f5"/>
  <text x="722" y="551" font-size="10" fill="#6b7280" text-anchor="middle">助手</text>
  <text x="750" y="552" font-size="12" fill="#1f2328">重点检查</text>
  <rect x="804" y="540" width="42" height="18" rx="3" fill="#fff3c4"/>
  <text x="808" y="553" font-size="12" font-weight="600" fill="#8a5a00">token</text>
  <text x="852" y="552" font-size="12" fill="#1f2328">过期与请求头时区</text>

  <line x1="680" y1="668" x2="1240" y2="668" stroke="#eef0f3"/>
  <text x="704" y="696" font-size="11" fill="#6b7280">3 条命中 · 3 个对话</text>
  <text x="864" y="696" font-size="11" fill="#8a919b">已扫描 12 个对话</text>
  <text x="1216" y="696" font-size="11" fill="#8a919b" text-anchor="end">86 ms</text>
  <text x="704" y="758" font-size="11" fill="#8a919b">输入即搜 · 点击结果自动定位并高亮</text>

  <!-- numbered badges -->
  <circle cx="660" cy="188" r="11" fill="#e8590c"/>
  <text x="660" y="192" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="660" cy="240" r="11" fill="#e8590c"/>
  <text x="660" y="244" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="660" cy="292" r="11" fill="#e8590c"/>
  <text x="660" y="296" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="660" cy="372" r="11" fill="#e8590c"/>
  <text x="660" y="376" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- legend -->
  <text x="680" y="840" font-size="11" fill="#4b5563">③ 输入内容，自动搜索</text>
  <text x="680" y="862" font-size="11" fill="#4b5563">④ 选择范围：当前对话 / 当前工作区</text>
  <text x="680" y="884" font-size="11" fill="#4b5563">⑤ 选择方式：模糊 / 关键词 / 正则</text>
  <text x="680" y="906" font-size="11" fill="#4b5563">⑥ 点击结果打开对应对话</text>

  <text x="1000" y="840" font-size="11" fill="#8a919b">① 输入框下方的「检索」</text>
  <text x="1000" y="862" font-size="11" fill="#8a919b">② 或在对话中按 ⌘⇧K</text>
  <text x="1000" y="884" font-size="11" fill="#8a919b">输入框工具行左侧也有放大镜</text>
</svg>
