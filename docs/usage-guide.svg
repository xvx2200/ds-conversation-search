  <text x="798" y="245" font-size="11" fill="#6b7280" text-anchor="middle">关键词</text>
  <text x="866" y="245" font-size="11" fill="#6b7280" text-anchor="middle">正则</text>
  <rect x="908" y="224" width="32" height="32" rx="7" fill="#ffffff" stroke="#d9dee5"/>
  <text x="924" y="245" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">Aa</text>
  <text x="956" y="245" font-size="11" fill="#8a919b">区分大小写</text>

