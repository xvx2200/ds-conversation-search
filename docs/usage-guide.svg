  <text x="700" y="294" font-size="11" fill="#8a919b">检索范围</text>
  <rect x="760" y="276" width="196" height="30" rx="8" fill="#f1f3f5"/>
  <rect x="762" y="278" width="96" height="26" rx="6" fill="#ffffff"/>
