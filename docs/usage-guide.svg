  <text x="106" y="878" font-size="12" fill="#6b7280">用量</text>
  <rect x="160" y="858" width="92" height="28" rx="14" fill="#fff3c4" stroke="#f0b429" stroke-width="1.5"/>
  <circle cx="176" cy="872" r="5.5" fill="none" stroke="#8a5a00" stroke-width="1.6"/>
  <path d="M180 876l4 4" stroke="#8a5a00" stroke-width="1.6" stroke-linecap="round"/>
  <text x="190" y="877" font-size="12" font-weight="600" fill="#8a5a00">检索</text>
  <path d="M262 872h22" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M282 868l4 4-4 4" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="294" y="877" font-size="11" fill="#e8590c">没有这个胶囊时，先刷新页面</text>

  <!-- ===================== Search panel ===================== -->
  <g filter="url(#shadow)">
    <rect x="680" y="104" width="560" height="700" rx="16" fill="#ffffff" stroke="#d9dee5"/>
  </g>
  <text x="704" y="136" font-size="14" font-weight="600" fill="#1f2328">对话检索</text>
  <text x="1214" y="136" font-size="18" fill="#8a919b" text-anchor="middle">×</text>
  <line x1="680" y1="152" x2="1240" y2="152" stroke="#eef0f3"/>

  <!-- input -->
  <rect x="700" y="168" width="520" height="40" rx="9" fill="#f7f8fa" stroke="#cfd6df"/>
  <circle cx="718" cy="188" r="5.5" fill="none" stroke="#8a919b" stroke-width="1.5"/>
  <path d="M722 192l4 4" stroke="#8a919b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="736" y="193" font-size="13" fill="#1f2328">错误码</text>
  <rect x="790" y="180" width="1.5" height="16" fill="#247bbf"/>

