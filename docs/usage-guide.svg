<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="920" fill="#eef1f5"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1f2328">对话检索 · 使用位置示意图</text>
  <text x="40" y="78" font-size="12" fill="#6b7280">示意图，非实际截图。实际界面随主题、语言和窗口宽度略有差异。</text>

  <rect x="1048" y="30" width="192" height="30" rx="15" fill="#ffffff" stroke="#d9dee5"/>
  <text x="1144" y="50" font-size="11" fill="#6b7280" text-anchor="middle">示意图 · 非实际截图</text>

  <!-- ===================== App window ===================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="104" width="600" height="700" rx="14" fill="#ffffff" stroke="#d9dee5"/>
  </g>
  <path d="M40 118a14 14 0 0 1 14-14h572a14 14 0 0 1 14 14v28H40z" fill="#f7f8fa"/>
  <line x1="40" y1="146" x2="640" y2="146" stroke="#e3e7ec"/>
  <circle cx="60" cy="125" r="4" fill="#d0d5dc"/>
  <circle cx="76" cy="125" r="4" fill="#d0d5dc"/>
  <circle cx="92" cy="125" r="4" fill="#d0d5dc"/>
  <text x="116" y="129" font-size="11" fill="#8a919b">DeepSeek Harness</text>

  <!-- sidebar -->
  <path d="M40 146h170v644a14 14 0 0 1-14 14H54a14 14 0 0 1-14-14z" fill="#f6f7f9"/>
  <line x1="210" y1="146" x2="210" y2="804" stroke="#e7eaee"/>
  <circle cx="62" cy="174" r="8" fill="#247bbf"/>
  <text x="78" y="179" font-size="12" font-weight="600" fill="#1f2328">DeepSeek</text>
  <text x="56" y="212" font-size="11" fill="#8a919b">工作区</text>

  <rect x="50" y="224" width="150" height="34" rx="8" fill="#e7f0fa"/>
  <rect x="58" y="236" width="4" height="10" rx="2" fill="#247bbf"/>
  <text x="72" y="246" font-size="12" fill="#1f2328">修复登录超时</text>
  <text x="64" y="288" font-size="12" fill="#4b5563">部署脚本排查</text>
  <text x="64" y="322" font-size="12" fill="#4b5563">对话检索插件</text>
  <text x="64" y="356" font-size="11" fill="#9aa1ab">更多…</text>
  <circle cx="66" cy="776" r="7" fill="none" stroke="#8a919b" stroke-width="1.4"/>
  <circle cx="66" cy="776" r="2.5" fill="#8a919b"/>
  <text x="82" y="780" font-size="12" fill="#6b7280">设置</text>

  <!-- conversation header -->
  <text x="232" y="180" font-size="14" font-weight="600" fill="#1f2328">修复登录超时</text>
  <text x="232" y="198" font-size="11" fill="#8a919b">当前工作区 · 3 分钟前</text>
  <line x1="210" y1="212" x2="640" y2="212" stroke="#eef0f3"/>

  <!-- messages -->
  <rect x="390" y="238" width="220" height="62" rx="12" fill="#e7f0fa"/>
  <text x="406" y="262" font-size="12" fill="#1f2328">登录一直超时，帮我看看</text>
  <text x="406" y="282" font-size="12" font-weight="600" fill="#1f5f9e">错误码 401</text>

  <rect x="232" y="318" width="308" height="86" rx="12" fill="#f4f5f7"/>
  <text x="248" y="342" font-size="12" fill="#1f2328">先检查 token 过期时间，再看请求头</text>
  <text x="248" y="362" font-size="12" fill="#1f2328">和时区。401 / 403 都指向鉴权。</text>
  <text x="248" y="386" font-size="11" fill="#8a919b">我来帮你定位，先检索一下历史记录。</text>

  <!-- composer card -->
  <rect x="226" y="530" width="396" height="140" rx="14" fill="#ffffff" stroke="#dfe3e8" filter="url(#soft)"/>
  <text x="244" y="560" font-size="12" fill="#9aa1ab">给 DeepSeek 发送消息…</text>

  <!-- shortcut badge -->
