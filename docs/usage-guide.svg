  <path d="M243 637l6 6M249 637l-6 6" stroke="#8a919b" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="268" y="628" width="58" height="24" rx="7" fill="#f4f5f7"/>
  <text x="297" y="644" font-size="11" fill="#6b7280" text-anchor="middle">权限</text>
  <rect x="334" y="628" width="72" height="24" rx="7" fill="#f4f5f7"/>
